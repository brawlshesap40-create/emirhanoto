services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emirhan
      POSTGRES_PASSWORD: emirhan_dev_password
      POSTGRES_DB: emirhanoto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
